name: build
on:
  schedule:
    - cron: "0 4 * * *"   # every day at 04:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

env:
  TARGET_IMAGE: ghcr.io/ziffusion/caddy
  DOCKER_IMAGES: "caddy:builder caddy:latest"
  GO_MODULES: "github.com/mholt/caddy-webdav github.com/caddyserver/forwardproxy github.com/lucaslorentz/caddy-docker-proxy/v2"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for upstream changes
        id: check
        run: |
          UPSTREAM_STATE=""

          # 1. Check both caddy:builder and caddy:latest digests
          for img in $DOCKER_IMAGES; do
            DIGEST=$(docker buildx imagetools inspect "$img" --format '{{json .Manifest.Digest}}' | tr -d '"')
            echo "Upstream image [$img]: $DIGEST"
            UPSTREAM_STATE="${UPSTREAM_STATE}${img}=${DIGEST};"
          done

          # 2. Check latest version of each Go module using native Go tooling
          for mod in $GO_MODULES; do
            MOD_VER=$(go list -m -f '{{.Version}}' "${mod}@latest")
            echo "Upstream module [$mod]: $MOD_VER"
            UPSTREAM_STATE="${UPSTREAM_STATE}${mod}=${MOD_VER};"
          done

          echo "upstream_state=$UPSTREAM_STATE" >> $GITHUB_OUTPUT

          # 3. Read the saved state label from our current linux/amd64 image on GHCR
          AMD64_DIGEST=$(docker buildx imagetools inspect "${TARGET_IMAGE}:latest" --raw 2>/dev/null | jq -r '.manifests[] | select(.platform.architecture == "amd64") | .digest' || echo "")

          if [[ -n "$AMD64_DIGEST" ]]; then
            CURRENT_STATE=$(docker buildx imagetools inspect "${TARGET_IMAGE}@${AMD64_DIGEST}" --format '{{index .Image.Config.Labels "org.opencontainers.image.base.digest"}}' 2>/dev/null || echo "none")
          else
            CURRENT_STATE="none"
          fi

          echo "----------------------------------------"
          echo "Trigger event:       ${{ github.event_name }}"
          echo "Upstream state:      $UPSTREAM_STATE"
          echo "Current image label: $CURRENT_STATE"
          echo "----------------------------------------"

          if [[ "${{ github.event_name }}" != "schedule" ]]; then
            echo "needs_build=true" >> $GITHUB_OUTPUT
            echo "Decision: Proceeding with build (triggered by '${{ github.event_name }}' event)."
          elif [[ "$UPSTREAM_STATE" != "$CURRENT_STATE" ]]; then
            echo "needs_build=true" >> $GITHUB_OUTPUT
            echo "Decision: Proceeding with build (one or more upstreams changed)."
          else
            echo "needs_build=false" >> $GITHUB_OUTPUT
            echo "Decision: Skipping build (scheduled run and all 5 upstreams unchanged)."
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.needs_build == 'true'

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.needs_build == 'true'
        with:
          context: .
          push: true
          pull: true
          labels: |
            org.opencontainers.image.base.digest=${{ steps.check.outputs.upstream_state }}
          tags: |
            ${{ env.TARGET_IMAGE }}:latest
            ${{ env.TARGET_IMAGE }}:${{ github.run_number }}
