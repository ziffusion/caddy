name: build
on:
  schedule:
    - cron: "0 4 * * *"   # every day at 04:00 UTC
  workflow_dispatch:
  push:
    branches: [main]

env:
  UPSTREAM_IMAGE: caddy:latest
  TARGET_IMAGE: ghcr.io/ziffusion/caddy

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for upstream changes
        id: check
        run: |
          # Get the top-level manifest digest of the upstream image
          UPSTREAM_DIGEST=$(docker buildx imagetools inspect ${{ env.UPSTREAM_IMAGE }} --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "upstream_digest=$UPSTREAM_DIGEST" >> $GITHUB_OUTPUT

          # Resolve the linux/amd64 child digest from our published image, then read its config label
          AMD64_DIGEST=$(docker buildx imagetools inspect ${{ env.TARGET_IMAGE }}:latest --raw 2>/dev/null | jq -r '.manifests[] | select(.platform.architecture == "amd64") | .digest' || echo "")

          if [[ -n "$AMD64_DIGEST" ]]; then
            CURRENT_DIGEST=$(docker buildx imagetools inspect ${{ env.TARGET_IMAGE }}@${AMD64_DIGEST} --format '{{index .Image.Config.Labels "org.opencontainers.image.base.digest"}}' 2>/dev/null || echo "none")
          else
            CURRENT_DIGEST="none"
          fi

          echo "Trigger event:        ${{ github.event_name }}"
          echo "Upstream digest:      $UPSTREAM_DIGEST"
          echo "Current image digest: $CURRENT_DIGEST"

          if [[ "${{ github.event_name }}" != "schedule" ]] || [[ "$UPSTREAM_DIGEST" != "$CURRENT_DIGEST" ]]; then
            echo "needs_build=true" >> $GITHUB_OUTPUT
            echo "Decision: Proceeding with build."
          else
            echo "needs_build=false" >> $GITHUB_OUTPUT
            echo "Decision: No upstream changes detected. Skipping build."
          fi

      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.needs_build == 'true'

      - uses: docker/build-push-action@v6
        if: steps.check.outputs.needs_build == 'true'
        with:
          context: .
          push: true
          pull: true
          labels: |
            org.opencontainers.image.base.digest=${{ steps.check.outputs.upstream_digest }}
          tags: |
            ${{ env.TARGET_IMAGE }}:latest
            ${{ env.TARGET_IMAGE }}:${{ github.run_number }}
