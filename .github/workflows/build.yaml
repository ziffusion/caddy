name: Build Caddy image

on:
  schedule:
    - cron: "17 4 * * *"        # daily, 04:17 UTC
  push:
    branches: [main]
    paths: [Dockerfile, .github/workflows/build.yml]
  workflow_dispatch:
    inputs:
      force:
        description: "Build even if nothing changed"
        type: boolean
        default: false

env:
  IMAGE: ghcr.io/${{ github.repository }}

permissions:
  contents: read
  packages: write

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      fingerprint: ${{ steps.fp.outputs.fingerprint }}
      build: ${{ steps.cmp.outputs.build }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute upstream fingerprint
        id: fp
        run: |
          set -euo pipefail
          fp=$(
            for img in caddy:builder caddy:latest; do
              echo "$img $(docker buildx imagetools inspect "$img" --format '{{.Manifest.Digest}}')"
            done
            for mod in \
              github.com/mholt/caddy-webdav \
              github.com/caddyserver/forwardproxy \
              github.com/lucaslorentz/caddy-docker-proxy/v2; do
              echo "$mod $(go list -m -f '{{.Version}}' "$mod@latest")"
            done
            echo "dockerfile $(sha256sum Dockerfile | cut -d' ' -f1)"
          )
          echo "$fp"
          # single line, ';'-separated, so it fits in an image label and a step output
          echo "fingerprint=$(echo "$fp" | paste -sd';')" >> "$GITHUB_OUTPUT"

      - name: Compare with last published image
        id: cmp
        env:
          CURRENT: ${{ steps.fp.outputs.fingerprint }}
          EVENT: ${{ github.event_name }}
          FORCE: ${{ inputs.force }}
        run: |
          set -u
          last=$(skopeo inspect --no-tags "docker://${IMAGE}:latest" 2>/dev/null \
                 | jq -r '.Labels["upstream.fingerprint"] // ""' || true)

          build=false
          reason="nothing changed"
          changes=""

          if [ -z "$last" ]; then
            reason="no previous image (or it has no fingerprint label)"
            build=true
          else
            echo "$last"    | tr ';' '\n' | sort > last.txt
            echo "$CURRENT" | tr ';' '\n' | sort > current.txt
            changes=$(diff -U0 last.txt current.txt | grep -E '^[+-][^+-]' || true)
            [ -n "$changes" ] && { reason="upstream changed"; build=true; }
          fi

          if [ "$EVENT" != "schedule" ]; then
            build=true; reason="triggered by $EVENT (${reason})"
          elif [ "$FORCE" = "true" ]; then
            build=true; reason="forced (${reason})"
          fi

          echo "build=$build" >> "$GITHUB_OUTPUT"

          {
            echo "### Build decision: \`$build\`"
            echo "**Reason:** $reason"
            if [ -n "$changes" ]; then
              echo
              echo '```diff'
              echo "$changes"
              echo '```'
            fi
          } | tee -a "$GITHUB_STEP_SUMMARY"

  build:
    needs: check
    if: needs.check.outputs.build == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=latest
            type=raw,value={{date 'YYYYMMDD'}}
          labels: |
            upstream.fingerprint=${{ needs.check.outputs.fingerprint }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          pull: true          # always fetch fresh base images
          no-cache: true      # otherwise xcaddy may reuse a cached layer with old plugin versions
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
